name: core-release

on:
  push:
    tags: ["core-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, image: quay.io/pypa/manylinux2014_x86_64, bin_ext: "", test: true }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, image: quay.io/pypa/manylinux2014_aarch64, bin_ext: "", test: true }
          - { platform: macos-arm64, os: macos-15, target: aarch64-apple-darwin, bin_ext: "", test: true }
          - { platform: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, bin_ext: "", test: true }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, bin_ext: .exe, test: true }
          - { platform: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, bin_ext: .exe, test: false }
    steps:
      - uses: actions/checkout@v7
      - name: Build Linux in manylinux2014
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD":/io -w /io -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" "${{ matrix.image }}" bash -euxo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target "${{ matrix.target }}"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo build --release --locked --target "${{ matrix.target }}" --bin prometheus-check
            bin="target/${{ matrix.target }}/release/prometheus-check"
            "$bin" --version
            max="$(objdump -T "$bin" | grep -o "GLIBC_[0-9][0-9.]*" | sed "s/^GLIBC_//" | sort -uV | tail -n1)"
            echo "highest GLIBC version referenced: ${max:-none}"
            test -n "$max" && test "$(printf "%s\n2.17\n" "$max" | sort -V | tail -n1)" = "2.17"
            mkdir -p upload
            cp "$bin" "upload/prometheus-check-${{ matrix.platform }}"
            chmod 0755 "upload/prometheus-check-${{ matrix.platform }}"
            chown -R "$HOST_UID:$HOST_GID" upload
          '
      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Package prometheus-check
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" --bin prometheus-check
          mkdir -p upload
          cp "target/${{ matrix.target }}/release/prometheus-check${{ matrix.bin_ext }}" "upload/prometheus-check-${{ matrix.platform }}${{ matrix.bin_ext }}"
      - name: Smoke-test
        if: matrix.test
        shell: bash
        run: |
          bin="upload/prometheus-check-${{ matrix.platform }}${{ matrix.bin_ext }}"
          chmod +x "$bin"
          version="$("$bin" --version)"
          echo "$version"
          expected="prometheus-check $(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "$version" = "$expected"
          if [ "$RUNNER_OS" = "Linux" ]; then ! ldd "$bin" | grep -qi libpython; fi
      - uses: actions/upload-artifact@v7
        with:
          name: prometheus-check-${{ matrix.platform }}
          path: upload/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ls -la
          test "$(ls | wc -l)" -eq 6
          {
            echo "prometheus-check binaries for runtime/prometheus_core.lock."
            echo
            echo '```'
            sha256sum -- *
            echo '```'
          } > ../notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file ../notes.md -- *

name: core-release

on:
  push:
    tags: ["core-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, image: quay.io/pypa/manylinux2014_x86_64, bin_ext: "", test: true }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, image: quay.io/pypa/manylinux2014_aarch64, bin_ext: "", test: true }
          - { platform: macos-arm64, os: macos-15, target: aarch64-apple-darwin, bin_ext: "", test: true }
          - { platform: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, bin_ext: "", test: true }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, bin_ext: .exe, test: true }
          - { platform: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, bin_ext: .exe, test: false }
    steps:
      - uses: actions/checkout@v7
      - name: Build Linux in manylinux2014
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD":/io -w /io -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" "${{ matrix.image }}" bash -euxo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target "${{ matrix.target }}"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo build --release --locked --target "${{ matrix.target }}" --bin prometheus-check --bin prometheus-kit
            mkdir -p upload
            for name in prometheus-check prometheus-kit; do
              bin="target/${{ matrix.target }}/release/${name}"
              "$bin" --version
              max="$(objdump -T "$bin" | grep -o "GLIBC_[0-9][0-9.]*" | sed "s/^GLIBC_//" | sort -uV | tail -n1)"
              echo "${name} highest GLIBC version referenced: ${max:-none}"
              test -n "$max" && test "$(printf "%s\n2.17\n" "$max" | sort -V | tail -n1)" = "2.17"
              cp "$bin" "upload/${name}-${{ matrix.platform }}"
              chmod 0755 "upload/${name}-${{ matrix.platform }}"
            done
            chown -R "$HOST_UID:$HOST_GID" upload
          '
      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Package binaries
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" --bin prometheus-check --bin prometheus-kit
          mkdir -p upload
          for name in prometheus-check prometheus-kit; do
            cp "target/${{ matrix.target }}/release/${name}${{ matrix.bin_ext }}" "upload/${name}-${{ matrix.platform }}${{ matrix.bin_ext }}"
          done
      - name: Smoke-test
        if: matrix.test
        shell: bash
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          for name in prometheus-check prometheus-kit; do
            bin="upload/${name}-${{ matrix.platform }}${{ matrix.bin_ext }}"
            chmod +x "$bin"
            version="$("$bin" --version)"
            echo "$version"
            test "$version" = "${name} ${crate_version}"
            if [ "$RUNNER_OS" = "Linux" ]; then ! ldd "$bin" | grep -qi libpython; fi
          done
          "upload/prometheus-kit-${{ matrix.platform }}${{ matrix.bin_ext }}" outline Cargo.toml >/dev/null
          "upload/prometheus-kit-${{ matrix.platform }}${{ matrix.bin_ext }}" hook --help >/dev/null
          "upload/prometheus-kit-${{ matrix.platform }}${{ matrix.bin_ext }}" droid-mode --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: prometheus-core-${{ matrix.platform }}
          path: upload/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ls -la
          test "$(ls | wc -l)" -eq 12
          {
            echo "prometheus-check and prometheus-kit binaries for runtime/prometheus_core.lock."
            echo
            echo '```'
            sha256sum -- *
            echo '```'
          } > ../notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file ../notes.md -- *

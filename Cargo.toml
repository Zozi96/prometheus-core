[package]
name = "prometheus-core"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "Deterministic engine for the Prometheus check runner and hook fast path."

[lib]
name = "prometheus_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "prometheus-hook"
path = "src/bin/prometheus-hook.rs"

[[bin]]
name = "prometheus-check"
path = "src/bin/prometheus-check.rs"

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py39", "generate-import-lib"], optional = true }
gix = { version = "=0.89.0", default-features = false, features = ["sha1", "parallel", "status", "dirwalk", "index", "excludes", "attributes"] }
# Already in the lock tree as gix's own diff backend (via gix-diff); named
# directly so the scan's hunk index uses the same line-diff engine git's
# porters validated, instead of adding a second diff implementation.
gix-imara-diff = "=0.3.1"
# The hook fast path (ticket #51) speaks the hosts' JSON hook protocol on
# stdin/stdout; std has no JSON, so serde_json is the parser of record.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 is baked into two Python-defined formats the fast path must match
# byte for byte: read-warning state keys and Droid writer label keys. gix
# hashes git objects (SHA-1), not these.
sha2 = "0.10"
# getuid() for the per-user session directory (parity with the Python
# runtime's record_path/secure_dir). Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "prometheus-core"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "In-process deterministic engine for the Prometheus gate: tree fingerprint and core git primitives."

[lib]
name = "prometheus_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py39", "generate-import-lib"] }
gix = { version = "=0.89.0", default-features = false, features = ["sha1", "parallel", "status", "dirwalk", "index", "excludes", "attributes"] }

[profile.release]
lto = "thin"
codegen-units = 1

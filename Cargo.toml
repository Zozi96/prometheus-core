[package]
name = "prometheus-core"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "Deterministic engine for the standalone prometheus-check runner."

[lib]
name = "prometheus_core"
crate-type = ["rlib"]

[[bin]]
name = "prometheus-check"
path = "src/bin/prometheus-check.rs"

[dependencies]
gix = { version = "=0.89.0", default-features = false, features = ["sha1", "parallel", "status", "dirwalk", "index", "excludes", "attributes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
